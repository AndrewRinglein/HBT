        <label>Outcome <select data-out="outcome"><option value="heroClear"${d.outcome === "heroClear" ? " selected" : ""}>won \u2014 the board cleared</option><option value="wipe"${d.outcome === "wipe" ? " selected" : ""}>lost \u2014 every hero down</option><option value="capped"${d.outcome === "capped" ? " selected" : ""}>turn cap \u2014 a loss</option></select></label>
        <label>Turns <input type="number" min="0" step="1" value="${d.turns}" data-out="turns"></label>
        <label>Hero phases <input type="number" min="0" step="1" value="${d.heroPhases}" data-out="heroPhases"></label>
        <label>Enemy phases <input type="number" min="0" step="1" value="${d.enemyPhases}" data-out="enemyPhases"></label>
      </div>
      <table><tr><th>unit</th><th>life</th><th>damage taken</th><th>damage dealt</th><th>kills</th></tr>
        ${d.units.map(unitRow).join("")}
      </table>
      <p class="meta">A kill is an opposing unit this one's damage reduced to zero. Enemy phases feed the XP speed bonus (15 \u2212 phases). A lost battle: set every hero down or dead.</p>
    </div>
    <div class="bar"><span class="sp"></span><button class="primary" data-act="decide">Propose the Reckoning \u2192</button></div>`;
  }
  function tallyScreen(c) {
    const b = c.cursor.battle;
    const r = b.result, k = b.reckoning;
    const hero = (id) => c.roster[id]?.name ?? id;
    return `<h2>The Reckoning \u2014 <span class="${k.won ? "won" : "lost"}">${k.won ? "won" : "lost"}</span></h2>
    <p class="meta"><code>${esc(r.id)}</code> \xB7 ${esc(r.outcome)} in ${r.turns} turns \xB7 ${r.enemyPhases} enemy phases. Proposed from the result; every value below may be changed before it is written.</p>
    <div class="cols">
      <div class="card"><h3>Heroes</h3><table><tr><th>hero</th><th>xp</th><th>wound</th><th>dead</th><th>mvp</th></tr>
        ${k.heroes.map((h, i) => `<tr><td>${esc(hero(h.heroId))}</td>
          <td><input type="number" min="0" step="1" value="${h.xp}" data-reck="xp" data-i="${i}"></td>
          <td><select data-reck="wound" data-i="${i}">${[0, 1, 2, 3].map((w) => `<option value="${w}"${h.wound === w ? " selected" : ""}>${woundNameOf(w)}</option>`).join("")}</select></td>
          <td><input type="checkbox" data-reck="dead" data-i="${i}"${h.dead ? " checked" : ""}></td>
          <td>${h.mvp ? "\u2605" : ""}</td></tr>`).join("")}
      </table></div>
      <div class="card"><h3>The Campaign</h3><table>
        <tr><td>Renown</td><td class="n"><input type="number" min="0" step="1" value="${k.renown}" data-reck="renown"></td></tr>
        <tr><td>Losses</td><td class="n"><input type="number" min="0" step="1" value="${k.losses}" data-reck="losses"></td></tr>
        <tr><td>Claim</td><td class="n">${k.claim ? `<code>${esc(k.claim)}</code>` : "\u2014"}</td></tr>
        <tr><td>Lose</td><td class="n">${k.lose ? `<code>${esc(k.lose)}</code>` : "\u2014"}</td></tr>
        ${k.grants.map((g, i) => `<tr><td>${esc(g.currency.replace("currency.", ""))}</td><td class="n"><input type="number" min="0" step="1" value="${g.amount}" data-reck="grant" data-i="${i}"></td></tr>`).join("")}
        ${k.grants.length ? "" : '<tr><td colspan="2" class="meta">no payout \u2014 only a first Conquer pays Salvage</td></tr>'}
      </table></div>
    </div>
    <div class="bar"><button class="quiet" data-act="back-to-panel">\u2190 Back to the panel</button><span class="sp"></span>${applyButton()}</div>`;
  }
  function applyButton() {
    return `<button class="primary" data-act="apply">Apply \u2014 write it to the Campaign</button>`;
  }
  function appliedScreen(c) {
    const e = c.cursor.engagement;
    const written = app.ctx.events.filter((ev) => ev.causeId === e?.id && ev.type !== "cursor.moved");
    const hero = (id) => typeof id === "string" ? c.roster[id]?.name ?? id : "";
    const line = (ev) => {
      switch (ev.type) {
        case "xp.gained":
          return `${hero(ev["heroId"])} +${ev["amount"]} XP \u2192 ${ev["xp"]}`;
        case "hero.wounded":
          return `${hero(ev["heroId"])} ${woundNameOf(ev["from"])} \u2192 ${woundNameOf(ev["to"])}`;
        case "hero.died":
          return `${hero(ev["heroId"])} died`;
        case "renown.gained":
          return `Renown +${ev["amount"]} \u2192 ${ev["renown"]}`;
        case "engagement.resolved":
          return `${ev["won"] ? "won" : "lost"} \u2014 losses ${ev["losses"]}`;
        case "territory.claimed":
          return `claimed ${ev["territoryId"]}${ev["buildings"].length ? " with " + ev["buildings"].join(", ") : ""}`;
        case "territory.lost":
          return `lost ${ev["territoryId"]}`;
        case "resource.gained":
          return `+${ev["amount"]} ${String(ev["currencyId"]).replace("currency.", "")} \u2192 ${ev["balance"]}`;
        default:
          return ev.type;
      }
    };
    return `<h2>Written</h2>
    <p class="meta"><code>${esc(e?.id ?? "")}</code> \u2014 every line below is an event the writer emitted; the save already holds it.</p>
    <div class="card"><table>${written.map((ev) => `<tr><td><code>${esc(ev.type)}</code></td><td>${esc(line(ev))}</td></tr>`).join("") || '<tr><td class="meta">nothing was written this session (loaded after the apply)</td></tr>'}</table>
      <p class="meta">difficulty now ${resolveDifficulty(c)} \xB7 Renown ${c.renown} \xB7 losses ${c.losses} \xB7 purse ${Object.entries(c.purse).map(([k, v]) => `${k.replace("currency.", "")} ${v}`).join(" \xB7 ")}</p></div>
    <div class="bar"><span class="sp"></span><button class="primary" data-act="exit">Exit \u2014 back to the Week</button></div>`;
  }
  function wire(root) {
    root.querySelectorAll("[data-act]").forEach((el) => {
      const actName = el.dataset["act"];
      if (actName === "load-file") {
        el.addEventListener("change", () => {
          const f = el.files?.[0];
          if (!f) return;
          f.text().then((t2) => loadJson(t2, f.name));
        });
        return;
      }
      el.addEventListener("click", () => {
        const id = el.dataset["id"];
        switch (actName) {
          case "load-fixture":
            return loadJson('{\n "realm": "realm.ruined-kingdom",\n "seed": 1,\n "week": 3,\n "cursor": {\n  "week": 3,\n  "stage": "stage.conquer",\n  "step": "prep",\n  "prepStep": "reveal",\n  "engagement": {\n   "id": "engagement.conquer.ridge.week-3",\n   "kind": "engagement.conquer",\n   "territoryId": "territory.ruined-kingdom.ridge",\n   "mapId": "map.ridge",\n   "enemies": [\n    "unit.zombie",\n    "unit.zombie",\n    "unit.zombie-hound",\n    "unit.skeletal-archer"\n   ],\n   "condition": null,\n   "councilOffer": [],\n   "tactic": null,\n   "deployed": [],\n   "seed": 1\n  },\n  "attack": null,\n  "fought": 0,\n  "recruited": 0,\n  "battle": null\n },\n "purse": {\n  "currency.faith": 6,\n  "currency.mana": 4,\n  "currency.salvage": 0,\n  "currency.supplies": 12\n },\n "renown": 2,\n "unlocks": [],\n "revealed": [],\n "roster": {\n  "hero.base.paladin-shiney": {\n   "id": "hero.base.paladin-shiney",\n   "name": "Osric",\n   "classes": [\n    "class.paladin"\n   ],\n   "level": 1,\n   "xp": 0,\n   "wound": 0,\n   "lifeState": "alive",\n   "badges": [],\n   "unitType": "alpha-osric",\n   "corruption": 0\n  },\n  "hero.base.priest-scantily": {\n   "id": "hero.base.priest-scantily",\n   "name": "Lucius",\n   "classes": [\n    "class.priest"\n   ],\n   "level": 1,\n   "xp": 0,\n   "wound": 0,\n   "lifeState": "alive",\n   "badges": [],\n   "unitType": "alpha-lucius",\n   "corruption": 0\n  },\n  "hero.fixed.air-mage": {\n   "id": "hero.fixed.air-mage",\n   "name": "Air Mage",\n   "classes": [\n    "class.mage"\n   ],\n   "level": 1,\n   "xp": 0,\n   "wound": 0,\n   "lifeState": "alive",\n   "badges": [],\n   "unitType": "alpha-air-mage",\n   "corruption": 0\n  },\n  "hero.fixed.orphans": {\n   "id": "hero.fixed.orphans",\n   "name": "Orphan Child",\n   "classes": [\n    "class.civilian"\n   ],\n   "level": 1,\n   "xp": 0,\n   "wound": 0,\n   "lifeState": "alive",\n   "badges": [],\n   "unitType": "hero.fixed.orphans",\n   "corruption": 0\n  },\n  "hero.shadows.dusk-hawk.v1": {\n   "id": "hero.shadows.dusk-hawk.v1",\n   "name": "Dusk Hawk",\n   "classes": [\n    "class.ranger"\n   ],\n   "level": 1,\n   "xp": 0,\n   "wound": 0,\n   "lifeState": "alive",\n   "badges": [],\n   "unitType": "alpha-dusk-hawk",\n   "corruption": 0\n  },\n  "hero.shadows.oathblade.v1": {\n   "id": "hero.shadows.oathblade.v1",\n   "name": "Oathblade",\n   "classes": [\n    "class.warrior"\n   ],\n   "level": 1,\n   "xp": 0,\n   "wound": 0,\n   "lifeState": "alive",\n   "badges": [],\n   "unitType": "alpha-oathblade",\n   "corruption": 0\n  },\n  "hero.skyship.sky-pirate.v1": {\n   "id": "hero.skyship.sky-pirate.v1",\n   "name": "Sky Pirate",\n   "classes": [\n    "class.rogue"\n   ],\n   "level": 1,\n   "xp": 0,\n   "wound": 0,\n   "lifeState": "alive",\n   "badges": [],\n   "unitType": "alpha-sky-pirate",\n   "corruption": 0\n  }\n },\n "assignments": {},\n "stash": [],\n "territories": {\n  "territory.ruined-kingdom.highlands": {\n   "id": "territory.ruined-kingdom.highlands",\n   "name": "The Highlands",\n   "mapId": "map.highlands",\n   "owned": false,\n   "kingdom": false,\n   "claimedOnce": false,\n   "buildings": [],\n   "adjacent": [\n    "territory.ruined-kingdom.sanctuary"\n   ],\n   "enemies": [\n    "unit.imp",\n    "unit.imp",\n    "unit.fire-imp",\n    "unit.poison-imp"\n   ],\n   "node": "abbey"\n  },\n  "territory.ruined-kingdom.ridge": {\n   "id": "territory.ruined-kingdom.ridge",\n   "name": "The Ridge",\n   "mapId": "map.ridge",\n   "owned": false,\n   "kingdom": false,\n   "claimedOnce": false,\n   "buildings": [\n    {\n     "id": "building.forge",\n     "level": 0,\n     "damaged": true\n    }\n   ],\n   "adjacent": [\n    "territory.ruined-kingdom.sanctuary",\n    "territory.ruined-kingdom.thicket"\n   ],\n   "enemies": [\n    "unit.zombie",\n    "unit.zombie",\n    "unit.zombie-hound",\n    "unit.skeletal-archer"\n   ],\n   "node": "mine"\n  },\n  "territory.ruined-kingdom.sanctuary": {\n   "id": "territory.ruined-kingdom.sanctuary",\n   "name": "Sanctuary",\n   "mapId": "map.open",\n   "owned": true,\n   "kingdom": true,\n   "claimedOnce": true,\n   "buildings": [],\n   "adjacent": [\n    "territory.ruined-kingdom.ridge",\n    "territory.ruined-kingdom.highlands"\n   ],\n   "enemies": [\n    "unit.zombie",\n    "unit.zombie",\n    "unit.zombie",\n    "unit.fast-zombie"\n   ],\n   "node": "field",\n   "lostDefenceCosts": {\n    "currency.supplies": 5\n   }\n  },\n  "territory.ruined-kingdom.thicket": {\n   "id": "territory.ruined-kingdom.thicket",\n   "name": "The Thicket",\n   "mapId": "map.thicket",\n   "owned": false,\n   "kingdom": false,\n   "claimedOnce": false,\n   "buildings": [],\n   "adjacent": [\n    "territory.ruined-kingdom.ridge"\n   ],\n   "enemies": [\n    "unit.bloodhound",\n    "unit.bloodhound",\n    "unit.hellhound",\n    "unit.zombie-hound"\n   ],\n   "node": "wellspring"\n  }\n },\n "threat": 0,\n "losses": 0,\n "quests": {},\n "captured": [],\n "unavailable": [],\n "cups": {\n  "cup.battle": 103521152,\n  "cup.council": 1142217377,\n  "cup.mvp": 1299473659,\n  "cup.reveal": 892881295,\n  "cup.reward": 2645491317,\n  "cup.threat": 3019024446,\n  "cup.unavailability": 1862212042\n }\n}\n', "the fixture");
          case "download":
            return download();
          case "forget":
            try {
              localStorage.removeItem(SAVE_KEY);
            } catch {
            }
            note("browser save forgotten");
            return render();
          case "advance":
            return act(() => app.ctx.campaign.cursor.step === "prep" ? performAdvancePrep(app.ctx, "slice") : performAdvance(app.ctx, "slice"));
          case "choose":
            return act(() => {
              performChooseEngagement(app.ctx, id, "slice");
            });
          case "recruit":
            return act(() => performRecruit(app.ctx, id, "slice"));
          case "heal":
            return act(() => performHeal(app.ctx, id, "slice"));
          case "labour":
            return act(() => performAssignLabour(app.ctx, id, el.dataset["key"], "slice"));
          case "release":
            return act(() => performRelease(app.ctx, id, "city", "slice"));
          case "council":
            return act(() => performCouncil(app.ctx, viewCombatPrep(app.ctx.campaign).tactic === id ? null : id, "slice"));
          case "deploy":
            return act(() => performDeploy(app.ctx, id, "slice"));
          case "undeploy":
            return act(() => performUndeploy(app.ctx, id, "slice"));
          case "decide":
            return act(() => {
              const e = app.ctx.campaign.cursor.engagement;
              const r = validateResult(app.draft, { heroes: e.deployed.length, enemies: e.enemies.length, id: e.id });
              const k = resolveReckoning(app.ctx.campaign, e, r);
              setBattleOutcome(app.ctx, r, k, "slice");
            });
          case "apply":
            return act(() => {
              const b = app.ctx.campaign.cursor.battle;
              applyBattleResult(app.ctx, app.ctx.campaign.cursor.engagement, b.result, b.reckoning);
              app.draft = null;
            });
          case "exit":
            return act(() => performExitBattle(app.ctx, "slice"));
          case "back-to-panel":
            return act(() => {
              app.draft = app.ctx.campaign.cursor.battle?.result ?? app.draft;
              setCursor(app.ctx, { battle: { resultSet: false } }, "slice");
            });
        }
      });
    });
    root.querySelectorAll("[data-fate]").forEach((el) => {
      el.addEventListener("change", () => {
        const side = el.dataset["side"], index = Number(el.dataset["index"]), field = el.dataset["fate"];
        const value = field === "lifeState" ? el.value : Math.max(0, Math.floor(Number(el.value) || 0));
        app.draft = withUnitFate(app.draft, side, index, { [field]: value });
        render();
      });
    });
    root.querySelectorAll("[data-out]").forEach((el) => {
      el.addEventListener("change", () => {
        const field = el.dataset["out"];
        const value = field === "outcome" ? el.value : Math.max(0, Math.floor(Number(el.value) || 0));
        app.draft = { ...app.draft, [field]: value };
        render();
      });
    });
    root.querySelectorAll("[data-reck]").forEach((el) => {
      el.addEventListener("change", () => {
        const b = app.ctx.campaign.cursor.battle;
        const k = JSON.parse(JSON.stringify(b.reckoning));
        const field = el.dataset["reck"];
        const i = el.dataset["i"];
        const n = Math.max(0, Math.floor(Number(el.value) || 0));
        if (field === "grant") k.grants[Number(i)].amount = n;
        else if (i !== void 0) {
          const h = k.heroes[Number(i)];
          if (field === "dead") h.dead = el.checked;
          else if (field === "wound") h.wound = Number(el.value);
          else if (field === "xp") h.xp = n;
        } else if (field === "renown" || field === "losses") k[field] = n;
        act(() => setBattleOutcome(app.ctx, b.result, k, "slice-edit"));
      });
    });
  }
  (() => {
    let saved = null;
    try {
      saved = localStorage.getItem(SAVE_KEY);
    } catch {
    }
    if (saved) loadJson(saved, "the browser save");
    else render();
  })();
})();

</script>
</body>
</html>
